name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup V Language
        uses: vlang/setup-v@v1

      - name: Verify Code Formatting
        run: |
          find . -type f \( -name "*.v" -o -name "*.vsh" \) -not -path "*/v/*" -not -path "*/vlang*" -not -path "*/.git/*" | while read -r f; do
            v fmt -w "$f"
          done
          git diff --exit-code

      - name: Setup SimpleGUI Module
        run: |
          mkdir -p ~/.vmodules
          ln -s "$PWD" ~/.vmodules/simplegui

      - name: Run Tests
        run: v -I . test tests/
