name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup V Language
        uses: vlang/setup-v@v1

      - name: Verify Code Formatting
        run: v fmt -verify $(find . -name ".git" -prune -o -name "v" -prune -o -name "vlang*" -prune -o -name "vlib" -prune -o \( -name "*.v" -o -name "*.vsh" \) -print)

      - name: Run Tests
        run: v test .
