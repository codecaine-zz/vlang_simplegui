name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup V Language
        uses: vlang/setup-v@v1

      - name: Verify Code Formatting
        run: |
          for f in *.v demos/*.v tests/*.v tools/*.v scripts/*.vsh examples/*.v; do
            v fmt -verify "$f" || exit 1
          done

      - name: Run Tests
        run: v test .
