name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup V Language
        uses: vlang/setup-v@v1

      - name: Verify Code Formatting
        run: |
          find . -name "*.v" -not -path "./v*" -not -path "*/.git/*" | while read -r f; do
            v fmt -w "$f"
          done
          if [ -n "$(git status --porcelain)" ]; then
            echo "Formatting differences detected. Auto-formatting code..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -am "ci: auto-format code with v fmt" || true
            git push origin HEAD:${{ github.ref_name }} || true
          fi

      - name: Setup SimpleGUI Module
        run: |
          mkdir -p ~/.vmodules
          ln -s "$PWD" ~/.vmodules/simplegui

      - name: Run Tests
        run: v test tests/
