name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup V Language
        uses: vlang/setup-v@v1

      - name: Verify Code Formatting
        run: |
          v fmt -w designer.v
          git diff designer.v
          find . -type f \( -name "*.v" -o -name "*.vsh" \) -not -path "*/v/*" -not -path "*/vlang*" -not -path "*/.git/*" | while read -r f; do
            v fmt -verify "$f" || { echo "::error file=$f::File $f is not formatted according to vfmt"; exit 1; }
          done

      - name: Run Tests
        run: v test .
